cache_dir: data
artifact_dir: artifacts/live
watchlist_path: platform/watchlist.yaml
warehouse_config_path: platform/warehouse.yaml
strategy:
  fast_sma: 15
  slow_sma: 60
  pivot_window: 3
  level_lookback: 90
  level_tolerance: 0.012
  fib_tolerance: 0.012
  signal_threshold: 3.25
  stop_atr: 1.0
  reward_risk: 3.0
  max_hold_bars: 20
  cooldown_bars: 3
  commission_bps: 2
  slippage_bps: 3
  atr_window: 14
datasets:
  - name: btcusdt_live_replay
    provider: bitget
    symbol: BTCUSDT
    interval: 1m
    limit: 720
    product_type: USDT-FUTURES
live:
  enabled: true
  runtime:
    arming_state: safe
    state_db_path: var/live-state.db
    observe_only: true
  exchange:
    venue: bitget
    product_type: USDT-FUTURES
    rest_base_url: https://api.bitget.com
    public_ws_url: wss://ws.bitget.com/v2/ws/public
    private_ws_url: wss://ws.bitget.com/v2/ws/private
    api_key_env: BITGET_API_KEY
    api_secret_env: BITGET_API_SECRET
    passphrase_env: BITGET_PASSPHRASE
    margin_mode: isolated
    position_mode: one_way_mode
  risk:
    max_leverage: 3
  agent:
    enabled: false
    advisory_only: true
insights:
  enabled: true
  scan_interval: 1m
  price_ttl: 30s
  daily_signal:
    interval: 1d
    lookback_bars: 1095
    min_score: 4.25
    score_quantile: 0.985
    cooldown_bars: 5
  anomaly:
    interval: 15m
    lookback_bars: 105120
    rolling_window: 20
    min_move_pct: 2.5
    move_quantile: 0.995
    min_volume_zscore: 3.5
    min_volume_ratio: 3.0
    volume_quantile: 0.995
    cooldown_bars: 8
  dashboard:
    platformctl_path: ./bin/platformctl
    marketd_restart_unit: quantlab-marketd.service
    render_symbol_limit: 24
