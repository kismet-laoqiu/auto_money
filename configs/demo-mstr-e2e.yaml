cache_dir: data
artifact_dir: artifacts/mstr-e2e
strategy:
  fast_sma: 15
  slow_sma: 60
  pivot_window: 3
  level_lookback: 90
  level_tolerance: 0.012
  fib_tolerance: 0.012
  signal_threshold: 3.25
  stop_atr: 1.0
  reward_risk: 3.0
  max_hold_bars: 20
  cooldown_bars: 3
  commission_bps: 2
  slippage_bps: 3
  atr_window: 14
datasets:
  - name: mstrusdt_demo_replay
    provider: bitget
    symbol: MSTRUSDT
    interval: 1m
    limit: 720
    product_type: USDT-FUTURES
live:
  enabled: true
  runtime:
    arming_state: safe
    state_db_path: var/mstr-e2e-state.db
    observe_only: true
  exchange:
    venue: bitget
    product_type: USDT-FUTURES
    rest_base_url: https://api.bitget.com
    public_ws_url: wss://ws.bitget.com/v2/ws/public
    private_ws_url: wss://ws.bitget.com/v2/ws/private
    api_key_env: BITGET_API_KEY
    api_secret_env: BITGET_API_SECRET
    passphrase_env: BITGET_PASSPHRASE
    margin_mode: isolated
    position_mode: one_way_mode
    symbols:
      - symbol: MSTRUSDT
        max_notional: 30
        max_tranches: 1
  risk:
    max_leverage: 3
  agent:
    enabled: false
    advisory_only: true
